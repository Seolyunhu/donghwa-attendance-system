
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>동화 인력 출퇴근 시스템</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <h2>동화 인력 출퇴근 시스템</h2>
  <input type="text" id="name" placeholder="이름 입력" />
  <button onclick="check('출근')">출근</button>
  <button onclick="check('퇴근')">퇴근</button>
  <p id="result"></p>

<script>
const API_BASE = "https://donghwa-flask.repl.co"; // 여기에 Flask 서버 주소 입력

function check(status) {
  const name = document.getElementById("name").value;
  fetch(API_BASE + "/check", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, status })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("result").innerText =
      `${data.name}님 ${data.status} 완료 (${data.time})`;
  });
}
</script>
</body>
</html>
